name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-test:
    name: Swift Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Run swift test
        run: swift test -Xswiftc -DMACOS

  swift-test-linux:
    name: Swift Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read Swift version
        run: echo "SWIFT_VERSION=$(cat .swift-version)" >> $GITHUB_ENV

      - name: Cache Swift toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: ${{ runner.os }}-swiftly-${{ env.SWIFT_VERSION }}

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Run swift test
        run: swift test

  embedded-compile:
    name: Embedded Swift Compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read Swift version
        run: echo "SWIFT_VERSION=$(cat .swift-version)" >> $GITHUB_ENV

      - name: Cache Swift toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.swiftly
          key: ${{ runner.os }}-swiftly-${{ env.SWIFT_VERSION }}

      - name: Install swiftly
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup

      - name: Install Swift toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: ~/.swiftly/bin/swiftly install ${{ env.SWIFT_VERSION }} --assume-yes

      - name: Add swiftly to PATH
        run: echo "$HOME/.swiftly/bin" >> $GITHUB_PATH

      - name: Compile (Embedded Swift → .o)
        run: make compile
